# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              generate_release_notes: true
            })

  deploy-prod:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/checkout@v4
        with:
          path: source

      - name: Build production
        run: |
          cp source/src/index.html gh-pages/index.html
          sed -i "s|ENVIRONMENT_NAME|production (${{ github.ref_name }})|" gh-pages/index.html
          sed -i "s|BRANCH_NAME|${{ github.ref_name }}|" gh-pages/index.html

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "deploy ${{ github.ref_name }} to production" || true
          git push