# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches:
      - staging        # only staging auto-deploys on push

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/checkout@v4
        with:
          path: source

      - name: Build environment
        run: |
          cp source/src/index.html gh-pages/index.html
          sed -i "s|ENVIRONMENT_NAME|staging|" gh-pages/index.html
          sed -i "s|BRANCH_NAME|staging|" gh-pages/index.html

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "deploy staging"
          git push