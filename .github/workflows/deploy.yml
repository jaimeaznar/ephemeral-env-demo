# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/checkout@v4
        with:
          path: source

      - name: Build environment
        run: |
          ENV_NAME=${{ github.ref_name == 'main' && 'production' || 'staging' }}
          cp source/src/index.html gh-pages/index.html
          sed -i "s|ENVIRONMENT_NAME|$ENV_NAME|" gh-pages/index.html
          sed -i "s|BRANCH_NAME|${{ github.ref_name }}|" gh-pages/index.html

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "deploy ${{ github.ref_name }}"
          git push